name: Expire Pending Orders

on:
  schedule:
    # Runs every 15 minutes so unpaid 15-minute holds release promptly on free Vercel Hobby
    # (vercel.json crons on Hobby are limited to once daily).
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  expire-orders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger expire-orders endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skipping: configure SITE_URL and CRON_SECRET repository secrets in GitHub Actions to enable 15-minute order expiration."
            exit 0
          fi

          TARGET_URL="${SITE_URL%/}/api/cron/expire-orders"
          STATUS=$(curl --silent --show-error --output /tmp/cron-response.json --write-out "%{http_code}" \
            -X GET "$TARGET_URL" \
            -H "Authorization: Bearer $CRON_SECRET")

          cat /tmp/cron-response.json
          echo ""
          echo "HTTP status: $STATUS"

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            exit 1
          fi
